Aether:
  # Surface
  #
  # No `modes:` block on purpose — this theme is always dark, so there is one
  # set of values instead of a light and a dark variant. Upstream's light mode
  # was a warm grey that turned brown against these cards, and "Automatic"
  # would flip into it during the day.
  #
  # Colours follow the luxury_dashboard theme (the "proef" dashboard): a near
  # black view (#0d0f10) with opaque cards just above it (#1e2022). Cards are
  # no longer translucent — see "Cards" below.
  primary-background-color: "#0d0f10"
  secondary-background-color: "#1e2022"
  app-header-background-color: "#0d0f10"
  app-theme-color: "#0d0f10" # Used on the top of the browser
  # Global
  # No lovelace-background on purpose: the view then falls back to
  # primary-background-color.
  light-primary-color: rgb(241, 241, 241) # Icons on sidebar
  divider-color: rgba(255, 255, 255, 0.07)
  accent-color: var(--primary-color)
  # Font — Poppins has to be loaded document-wide (see README); an @import here
  # lands in a shadow root, where @font-face is ignored.
  #
  # ha-font-family-* are the ones the frontend actually reads. primary-font-family
  # and the paper-font-* set are dead as far as core HA goes — grep the bundle
  # and there is not a single var(--primary-font-family) left — but custom cards
  # still pick them up, so they stay.
  ha-font-family-body: "'Poppins', sans-serif"
  ha-font-family-heading: "'Poppins', sans-serif"
  ha-font-family-longform: "'Poppins', sans-serif"
  primary-font-family: "'Poppins', sans-serif"
  paper-font-common-base_-_font-family: "'Poppins', sans-serif"
  paper-font-body1_-_font-family: "'Poppins', sans-serif"
  paper-font-subhead_-_font-family: "'Poppins', sans-serif"
  paper-font-headline_-_font-family: "'Poppins', sans-serif"
  paper-font-caption_-_font-family: "'Poppins', sans-serif"
  paper-font-title_-_font-family: "'Poppins', sans-serif"
  # Text
  primary-text-color: "#ffffff"
  secondary-text-color: "#5b5b5c"
  ha-color-text-secondary: var(--secondary-text-color)
  text-primary-color: var(--primary-text-color)
  disabled-text-color: rgba(208, 208, 208, 0.5) # XXX: https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/2
  text-dark-color: var(--primary-text-color)
  # Sidebar Menu
  sidebar-background-color: var(--primary-background-color)
  sidebar-icon-color: var(--light-primary-color)
  sidebar-text-color: var(--light-primary-color)
  sidebar-selected-background-color: var(--primary-background-color)
  sidebar-selected-icon-color: var(--primary-text-color)
  sidebar-selected-text-color: var(--sidebar-selected-icon-color)
  # States and Badges
  state-icon-color: var(--primary-text-color)
  state-icon-active-color: var(--yellow-color)
  state-icon-unavailable-color: var(--disabled-text-color)
  state-inactive-color: var(--disabled-text-color)
  paper-item-icon-active-color: var(--state-icon-active-color) # see https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/30
  # Sliders
  paper-slider-knob-color: "#FFFFFF"
  paper-slider-knob-start-color: var(--paper-slider-knob-color)
  paper-slider-pin-color: var(--paper-slider-knob-color)
  paper-slider-active-color: "#0984ff" # from Apple systemBlue dark mode
  paper-slider-secondary-color: var(--paper-slider-knob-color)
  paper-slider-container-color: rgba(255, 255, 255, 0.5)
  paper-slider-font-color: "#000"
  ha-slider-background: none !important
  # Labels
  label-badge-background-color: "#23232E"
  label-badge-text-color: "#F1F1F1"
  label-badge-red: rgba(255, 159, 9, 0.7) # from Apple systemOrange dark mode
  # Cards — opaque, flat, 16px. Matches the luxury_dashboard theme.
  #
  # No box-shadow: on a near black background a black drop shadow adds nothing
  # and only muddies the edges. The depth comes from #0d0f10 → #1e2022.
  # No backdrop-filter either — there is nothing behind an opaque card to blur.
  card-background-color: var(--secondary-background-color) # Data table background
  paper-listbox-background-color: var(--primary-background-color)
  ha-card-background: "#1e2022"
  ha-card-border-radius: 16px
  paper-card-background-color: var(--ha-card-background)
  rgb-card-background-color: rgb(30, 32, 34)
  ha-card-border-width: 0 # https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/82#event-7732695357
  ha-card-backdrop-filter: none
  ha-card-box-shadow: none
  # Card titles: small and grey, like the luxury_dashboard headings.
  #
  # These three variables are read by ha-card itself, so they reach every card
  # type. That matters: entities-style cards keep .card-header in their own
  # shadow root, but glance-style cards hand the title to ha-card and it ends up
  # one level deeper, where card-mod does not inject. Styling it through
  # card-mod would have covered the first and missed the second.
  #
  # The trade-off is that there is no variable for text-transform or
  # letter-spacing, so the titles are not uppercase and tracked out the way
  # luxury_dashboard's own headings are.
  ha-card-header-font-size: 13px
  ha-card-header-color: var(--secondary-text-color)
  ha-card-header-font-family: var(--ha-font-family-heading)
  # Toggles
  paper-toggle-button-checked-button-color: "#484848"
  paper-toggle-button-checked-bar-color: "#484848"
  paper-toggle-button-unchecked-button-color: var(--paper-toggle-button-checked-button-color)
  paper-toggle-button-unchecked-bar-color: var(--disabled-text-color)
  # Table row
  table-row-background-color: var(--primary-background-color)
  table-row-alternative-background-color: var(--secondary-background-color)
  # Switches
  switch-checked-track-color: var(--green-color)
  switch-checked-button-color: "#FFF"
  switch-unchecked-track-color: var(--disabled-text-color)
  switch-unchecked-button-color: "#FFF"
  # Dialog
  ha-dialog-surface-backdrop-filter: none
  dialog-box-shadow: var(--ha-card-box-shadow)
  ha-dialog-surface-background: var(--ha-card-background)
  ha-dialog-border-radius: 20px
  ha-dialog-scrim-backdrop-filter: none
  dialog-backdrop-filter: blur(6px)
  # Header
  app-header-backdrop-filter: none
  app-header-text-color: var(--primary-text-color)
  app-header-edit-background-color: rgba(0, 0, 0, 0.2)
  # Colors
  red-color: "#FF453A"
  pink-color: "#FF375F"
  purple-color: "#BF5AF2"
  indigo-color: "#5E5CE6"
  blue-color: "#0A84FF"
  light-blue-color: "#66D4CF"
  cyan-color: "#5AC8F5"
  teal-color: "#6AC4DC"
  green-color: "#32D74B"
  yellow-color: "#FFD60A"
  orange-color: "#FF9F0A"
  brown-color: "#AC8E68"
  # UI accent: links, active tab underline, radio buttons, checkboxes, sliders.
  # Upstream used orange here; this is the cyan of the luxury_dashboard theme.
  # The orange/yellow above are left alone — they are entity state colours, and
  # an active light should not read as "accent".
  primary-color: "#38f2e9"
  ha-color-primary-05: "#0b302f"
  ha-color-primary-10: "#16615d"
  ha-color-primary-20: "#22918c"
  ha-color-primary-30: "#2dc2ba"
  ha-color-primary-40: var(--primary-color)
  ha-color-primary-50: "#44f3ea"
  ha-color-primary-60: "#58f4ed"
  ha-color-primary-70: "#82f7f1"
  ha-color-primary-80: "#affaf6"
  ha-color-primary-90: "#d7fcfb"
  ha-color-primary-95: "#ebfefd"
  # Other
  paper-dialog-background-color: rgba(55, 55, 55, 0.8) # e.g., background of more-info
  paper-item-icon-color: white # also should mini-media-player icon white (but doesn't work by itself)
  more-info-header-background: rgba(25, 25, 25, 0.5)
  lumo-body-text-color: var(--primary-text-color) # see https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/42
  markdown-code-background-color: "#464646"
  code-editor-background-color: "#161616"
  clear-background-color: var(--ha-card-background) # see https://github.com/basnijholt/lovelace-ios-themes/issues/64
  mdc-theme-surface: var(--secondary-background-color) # this should be opaque as it's used by default for many overlays
  material-background-color: var(--secondary-background-color)
  mdc-checkbox-unchecked-color: "#FFF"
  mdc-radio-unchecked-color: "#FFF"
  # Custom
  mcg-title-letter-spacing: .15em
  mini-media-player-base-color: white
  mini-media-player-icon-color: white
  # Added for https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/72
  input-ink-color: var(--primary-text-color)
  input-fill-color: transparent
  input-disabled-fill-color: transparent
  input-label-ink-color: var(--primary-text-color)
  input-disabled-ink-color: var(--disabled-text-color)
  input-dropdown-icon-color: var(--primary-text-color)
  input-idle-line-color: var(--secondary-text-color)
  input-hover-line-color: var(--secondary-text-color)
  codemirror-property: var(--accent-color)
  md-list-container-color: none # ha-md-list already has a card background
  # Dropdown
  wa-shadow-m: var(--ha-card-box-shadow)
  wa-border-radius-s: 16px
  wa-border-radius-m: var(--ha-card-border-radius)
  wa-border-width-s: 0px
  ha-color-on-neutral-normal: var(--primary-text-color) # icon color
  wa-color-neutral-fill-normal: "#FFFFFF14" # hover color
  ha-color-form-background: var(--ha-card-background)
  ha-color-form-background-hover: var(--ha-card-background)
  ha-color-form-background-disabled: var(--ha-card-background)
  ha-color-fill-primary-quiet-resting: rgba(255, 255, 255, 0.12) # selection color
  ha-color-fill-primary-quiet-hover: rgba(255, 255, 255, 0.2) # selection hover color

  card-mod-theme: "Aether"
  card-mod-drawer-yaml: |
    .: |
      .mdc-drawer,
      .sidebar-shell {
        background-color: var(--primary-background-color) !important;
      }
  card-mod-card: |
    /* Entity rows: ruled, with room to breathe.
       Only reachable from here — the row internals (the value, the icon badge)
       live one shadow root deeper, in hui-generic-entity-row, where card-mod
       does not inject. See README. */
    #states > div {
      padding: 10px 0;
    }
    #states > div:not(:last-child) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Cards that should not carry a surface of their own */
    :host(hui-heading-card) ha-card,
    ha-card.text-only,
    :host(mushroom-title-card) ha-card,
    :host(mushroom-chips-card) ha-card {
      background: none !important;
      box-shadow: none !important;
    }
    ha-card.text-only {
      overflow: visible;
    }

    /* Energy dashboard */
    .mdc-data-table,
    .mdc-data-table__row,
    .mdc-data-table__header-cell,
    ha-sankey-chart {
      background: none !important;
    }
